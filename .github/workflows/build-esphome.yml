name: Build ESPHome Firmware

on:
  push:
    branches: [main]
    paths:
      - '**.yaml'

concurrency:
  group: build-firmware
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.device.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: gophr-sim
            file: gophr_sim_cores3.yaml

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build firmware
        uses: esphome/build-action@v7
        id: esphome-build
        with:
          yaml-file: ${{ matrix.device.file }}

      - name: Get version from YAML
        id: version
        run: |
          VERSION=$(grep 'software_version:' ${{ matrix.device.file }} | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware version: $VERSION"

      - name: Rename firmware files
        run: |
          mkdir -p output
          mkdir -p firmware
          BUILD_DIR="${{ steps.esphome-build.outputs.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          NAME="${{ matrix.device.name }}"

          # OTA bin → output/ (for GitHub Release)
          for file in "$BUILD_DIR"/*.ota.bin; do
            [ -f "$file" ] && cp "$file" "output/${NAME}-${VERSION}.ota.bin"
          done

          # Factory bin → firmware/ (to commit to repo)
          for file in "$BUILD_DIR"/*.factory.bin; do
            [ -f "$file" ] && cp "$file" "firmware/${NAME}.factory.bin"
          done

          echo "Release files:"
          ls -la output/
          echo "Repo files:"
          ls -la firmware/

      - name: Commit factory bin to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware/
          git diff --cached --quiet || git commit -m "Build: ${NAME} factory bin v${VERSION}

          Auto-built from ${{ github.sha }}"
          git push
        env:
          NAME: ${{ matrix.device.name }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device.name }}-firmware
          path: output/*.bin

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.device.name }}-v${{ steps.version.outputs.version }}
          name: "${{ matrix.device.name }} v${{ steps.version.outputs.version }}"
          body: |
            Automated firmware build for **${{ matrix.device.name }}**

            - Version: `${{ steps.version.outputs.version }}`
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}

            **Files:**
            - `.ota.bin` — OTA update (in release)
            - `.factory.bin` — Full flash (in `firmware/` folder)
          files: output/*.ota.bin
          make_latest: true
